<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- CSS Keyframe Animations -->
    <style>
      .glow-pulse {
        animation: pulseGlow 5s ease-in-out infinite alternate;
      }
      .node-flow {
        stroke-dasharray: 8 6;
        animation: flowDash 25s linear infinite;
      }
      .signal-dot-1 {
        animation: moveDot1 6s ease-in-out infinite;
      }
      .signal-dot-2 {
        animation: moveDot2 7s ease-in-out infinite 1.5s;
      }
      .scan-line {
        animation: scanAnim 3.5s ease-in-out infinite alternate;
      }
      .card-float-1 {
        animation: floatAnim1 6s ease-in-out infinite alternate;
      }
      .card-float-2 {
        animation: floatAnim2 7s ease-in-out infinite alternate;
      }
      .card-float-3 {
        animation: floatAnim3 6.5s ease-in-out infinite alternate;
      }
      .shimmer {
        animation: shimmerText 8s linear infinite;
      }

      @keyframes pulseGlow {
        0% { opacity: 0.25; transform: scale(0.98); }
        100% { opacity: 0.55; transform: scale(1.02); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -200; }
      }
      @keyframes scanAnim {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateY(110px); opacity: 0.2; }
      }
      @keyframes floatAnim1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatAnim2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
      @keyframes floatAnim3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
      @keyframes moveDot1 {
        0% { cx: 220; cy: 285; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { cx: 480; cy: 285; opacity: 0; }
      }
      @keyframes moveDot2 {
        0% { cx: 720; cy: 285; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { cx: 980; cy: 285; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGradient)" rx="16" />

  <!-- Grid Pattern Overlay in Background -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Ambient Glowing Orbs (Behind content) -->
  <circle cx="200" cy="90" r="130" fill="url(#glowGradient)" class="glow-pulse" />
  <circle cx="1020" cy="180" r="160" fill="url(#glowGradient)" class="glow-pulse" style="animation-delay: -2.5s;" />

  <!-- Animated Orchestration Pipeline Flow Lines (Bottom background) -->
  <g stroke-linecap="round">
    <!-- Connecting pipeline tracks -->
    <path d="M 180 285 L 480 285 L 600 285 L 720 285 L 1020 285" stroke="#334155" stroke-width="3" fill="none" />
    <path d="M 180 285 L 480 285 L 600 285 L 720 285 L 1020 285" stroke="#38bdf8" stroke-width="3" fill="none" class="node-flow" opacity="0.6" />
    
    <!-- Flowing data packet dots -->
    <circle r="4" fill="#38bdf8" class="signal-dot-1" />
    <circle r="4" fill="#818cf8" class="signal-dot-2" />
  </g>

  <!-- Decorative Animated Flow Cards / Nodes (Positioned securely below and flanking, never obstructing title/subtitle) -->
  <!-- Node 1: Document OCR / Capture -->
  <g class="card-float-1" transform="translate(100, 245)">
    <rect width="190" height="76" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))" />
    <circle cx="28" cy="38" r="14" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2" />
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">📄</text>
    <text x="52" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">ID / Document</text>
    <text x="52" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">OCR &amp; MRZ Engine</text>
  </g>

  <!-- Node 2: Biometric Liveness -->
  <g class="card-float-2" transform="translate(370, 245)">
    <rect width="200" height="76" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))" />
    <circle cx="28" cy="38" r="14" fill="#4f46e5" fill-opacity="0.25" stroke="#818cf8" stroke-width="1.2" />
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#818cf8" text-anchor="middle">👤</text>
    <text x="52" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Facial Biometrics</text>
    <text x="52" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">3D Liveness &amp; Match</text>
  </g>

  <!-- Node 3: Risk & AML Orchestrator -->
  <g class="card-float-3" transform="translate(640, 245)">
    <rect width="200" height="76" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))" />
    <circle cx="28" cy="38" r="14" fill="#9333ea" fill-opacity="0.25" stroke="#c084fc" stroke-width="1.2" />
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#c084fc" text-anchor="middle">⚡</text>
    <text x="52" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Decision Engine</text>
    <text x="52" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">AML &amp; PEP Screening</text>
  </g>

  <!-- Node 4: Verified Identity Status -->
  <g class="card-float-1" transform="translate(910, 245)">
    <rect width="190" height="76" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.7" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))" />
    <circle cx="28" cy="38" r="14" fill="#059669" fill-opacity="0.25" stroke="#10b981" stroke-width="1.2" />
    <text x="28" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">🛡️</text>
    <text x="52" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Trusted Identity</text>
    <text x="52" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399">Tamper-Proof Audit</text>
  </g>

  <!-- FOREGROUND: Top Category Pill Badge -->
  <g transform="translate(600, 48)" text-anchor="middle">
    <rect x="-185" y="-14" width="370" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
    <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
      🚀 THE ULTIMATE IDENTITY ORCHESTRATION ECOSYSTEM
    </text>
  </g>

  <!-- FOREGROUND: Main Title (Distinct & Crisp in foreground) -->
  <text x="600" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="35" font-weight="800" fill="url(#titleGradient)" text-anchor="middle" letter-spacing="-0.5" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.8))">
    Awesome Know Your Customer (KYC)
  </text>
  <text x="600" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="30" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.5" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.8))">
    &amp; Identity Orchestrator
  </text>

  <!-- FOREGROUND: Subtitle -->
  <text x="600" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Curated Hub of Production SaaS Platforms &amp; Open-Source KYC / Biometrics / AML Toolkits
  </text>
</svg>
